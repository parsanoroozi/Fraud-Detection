name: Build and Deploy Code

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: pulling git repo
        uses: actions/checkout@v4

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx
      - name: test with pytest
        working-directory: backend
        run: pytest

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [ build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: pulling git repo
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: copy built frontend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{secrets.PROD_HOST}}
          username: ${{secrets.PROD_USERNAME}}
          password: ${{secrets.PROD_PASSWORD}}
          port: ${{secrets.PROD_PORT}}
          source: frontend/dist
          target: app/src/Fraud-Detection/backend/static
          strip_components: 2
          rm: true

      - name: deploy to ubuntu server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.PROD_HOST}}
          username: ${{secrets.PROD_USERNAME}}
          password: ${{secrets.PROD_PASSWORD}}
          port: ${{secrets.PROD_PORT}}
          script: |
            set -e
            cd app/src/Fraud-Detection
            git pull
            venv/bin/pip install -q -r backend/requirements.txt
            echo ${{secrets.PROD_PASSWORD}} | sudo -S systemctl restart fraud-detection
            sleep 2
            curl -fsS http://localhost:8001/api/health
